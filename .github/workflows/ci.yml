name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 같은 브랜치에 연속으로 push하면 이전 실행은 취소 — CI 시간·비용 절약
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile (문법 오류 조기 발견)
        run: python -m compileall -q app seed.py

      - name: Import check (앱이 최소한 로드는 되는지 확인)
        # 실제 DB·Redis 연결 없이도 모듈 임포트 자체는 성공해야 한다.
        # (client.py가 키 없으면 None을 반환하도록 되어 있어 이 단계는 키 없이도 통과함)
        run: python -c "from app.main import app; print('OK:', app.title)"
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sotonghaeyo
          REDIS_URL: redis://localhost:6379/0

      - name: Run tests
        # 안전 판정 경로(F3 욕설·위협 필터, 자동 응대 게이트, 접수자 귀속)의
        # 회귀를 막는 스위트. DB·Redis·네트워크 없이 도는 순수 함수 테스트라
        # 서비스 컨테이너가 필요 없다(1초 이내).
        #
        # 이 스텝이 빠지면 필터 패턴을 넓히다 정당한 민원을 오차단하거나,
        # 게이트가 뚫려 학교폭력 민원이 자동 응대되는 회귀를 아무도 못 잡는다.
        # 실제로 두 사고 모두 이 테스트를 작성하는 과정에서 발견됐다.
        run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sotonghaeyo
          REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (workspaces 전체)
        run: npm ci

      - name: Typecheck (shared + web)
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (push 안 함 — Dockerfile 유효성만 검증)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: sotong-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
