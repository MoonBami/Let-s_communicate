name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 같은 브랜치에 연속으로 push하면 이전 실행은 취소 — CI 시간·비용 절약
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile (문법 오류 조기 발견)
        run: python -m compileall -q app seed.py

      - name: Import check (앱이 최소한 로드는 되는지 확인)
        # 실제 DB·Redis 연결 없이도 모듈 임포트 자체는 성공해야 한다.
        # (client.py가 키 없으면 None을 반환하도록 되어 있어 이 단계는 키 없이도 통과함)
        run: python -c "from app.main import app; print('OK:', app.title)"
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sotonghaeyo
          REDIS_URL: redis://localhost:6379/0

      # 리포에 아직 테스트 스위트가 없음 (docs/development-status.md §6-1 참고).
      # 테스트가 추가되면 여기에 `pytest` 스텝을 넣는다.
      # - name: Run tests
      #   run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (workspaces 전체)
        run: npm ci

      - name: Typecheck (shared + web)
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (push 안 함 — Dockerfile 유효성만 검증)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: sotong-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
